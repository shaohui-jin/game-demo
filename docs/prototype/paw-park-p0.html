<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>爪爪乐园 · P0 原型 v2（母体链）</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #FBF9F6; color: #2C2C2A;
  overscroll-behavior: none;
}
#app {
  max-width: 460px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding: 8px 10px 14px; gap: 7px;
}

/* ===== 屏幕震动：振幅由 --shk 控制，默认极轻 ===== */
#app.shake { animation: shakeK .2s cubic-bezier(.36,.07,.19,.97); }
@keyframes shakeK {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(calc(var(--shk, 1.3px) * -1), calc(var(--shk, 1.3px) * .28)); }
  55% { transform: translate(var(--shk, 1.3px), calc(var(--shk, 1.3px) * -.35)); }
  80% { transform: translate(calc(var(--shk, 1.3px) * -.5), 0); }
}

#fx { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 9000; }

/* ==================== 顶部 HUD ==================== */
.hud { display: flex; gap: 6px; align-items: stretch; }
.coin {
  display: flex; align-items: center; gap: 5px;
  background: #fff; border: 1px solid #E8E3DC; border-radius: 10px;
  padding: 6px 10px 6px 7px; flex: 1; min-width: 0;
  transition: transform .18s cubic-bezier(.34,1.56,.64,1);
}
.coin .ico { font-size: 15px; line-height: 1; flex-shrink: 0; }
.coin .val {
  font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.coin.bump { transform: scale(1.07); }
.coin.stamina { flex: 1.15; flex-direction: column; align-items: stretch; gap: 3px; padding: 5px 9px; }
.coin.stamina .row { display: flex; align-items: center; gap: 5px; }
.coin .sub {
  font-size: 9.5px; color: #A8A49C; margin-left: auto;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
/* 可领补贴状态 */
.coin.stamina.bonus {
  border-color: #BA7517; background: #FDF7EC; cursor: pointer;
  animation: bonusPulse 1.6s ease-in-out infinite;
}
@keyframes bonusPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(186,117,23,.4); }
  50% { box-shadow: 0 0 0 6px rgba(186,117,23,0); }
}
.coin.stamina.bonus .sub { color: #854F0B; font-weight: 700; }
.coin .bar { height: 3.5px; border-radius: 3px; background: #EFEBE5; overflow: hidden; }
.coin .bar i { display: block; height: 100%; border-radius: 3px; background: #1D9E75; transition: width .35s cubic-bezier(.22,1,.36,1); }

/* ==================== 功能栏 ==================== */
.tools { display: flex; gap: 6px; align-items: stretch; }
.tool {
  flex: 1; background: #fff; border: 1px solid #E8E3DC; border-radius: 10px;
  padding: 7px 8px; display: flex; align-items: center; gap: 7px;
  cursor: pointer; user-select: none; min-width: 0;
  transition: transform .09s ease, border-color .15s;
}
.tool:active { transform: scale(.96); border-color: #BA7517; }
.tool .em { font-size: 19px; line-height: 1; flex-shrink: 0; }
.tool .tx { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.tool .t1 { font-size: 12px; font-weight: 600; white-space: nowrap; }
.tool .t2 { font-size: 10px; color: #8A8781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool.go {
  flex: 0 0 auto; background: #4CAF50; border-color: #4CAF50;
  padding: 7px 16px; justify-content: center;
}
.tool.go .t1 { color: #fff; font-size: 13.5px; }
.tool.go:active { transform: scale(.95); }
.tool.go.ready { animation: goPulse 1.6s ease-in-out infinite; }
@keyframes goPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,.5); }
  50% { box-shadow: 0 0 0 7px rgba(76,175,80,0); }
}

/* ==================== 棋盘 ==================== */
#board {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  background: #F1EFE8;
  border: 1px solid #E8E3DC;
  border-radius: 14px;
  padding: 6px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  width: min(100%, calc((100vh - 360px) * 7 / 9));
  width: min(100%, calc((100dvh - 340px) * 7 / 9));
  min-width: 238px;
  margin: 0 auto;
}
.cell {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  background: #FFFFFF;
  border: 1px solid #EFEBE5;
}
.cell.locked { background: #E6E3DC; border-color: #DDD8CF; }
.cell.locked::after {
  content: '🔒';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; opacity: .28;
}
.cell.ok { box-shadow: inset 0 0 0 2px #1D9E75; }
.cell.merge { box-shadow: inset 0 0 0 2px #D4537E; background: #FDF2F6; }
.cell.gen-hint { box-shadow: inset 0 0 0 2px #BA7517; background: #FDF7EC; }
/* 拖物品到蛛网上：提示"可以牺牲它来清网" */
.cell.websac { box-shadow: inset 0 0 0 2px #BA7517; background: #FDF7EC; }

/* ---- 蛛网障碍 ---- */
.cell.webbed { background: #F2EFE8; border-color: #E0DAD0; }
.web {
  position: absolute; inset: 2px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; line-height: 1;
  background: linear-gradient(155deg, #FFFFFF 0%, #EDE9E0 100%);
  box-shadow: inset 0 0 0 1px #DCD5CA;
  cursor: pointer;
}
.web .wp {
  position: absolute; right: 1px; bottom: 0;
  font-size: 8.5px; font-weight: 700; color: #854F0B;
  font-variant-numeric: tabular-nums;
}
.web.clear { animation: webClear .34s ease-out forwards; }
@keyframes webClear {
  0%   { transform: scale(1); opacity: 1; }
  40%  { transform: scale(1.22) rotate(8deg); opacity: .85; }
  100% { transform: scale(.4) rotate(-14deg); opacity: 0; }
}

.item {
  position: absolute; inset: 2px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; line-height: 1;
  will-change: transform;
  touch-action: none;
}
.item .lv {
  position: absolute; right: 1px; bottom: 0px;
  font-size: 9px; font-weight: 700; opacity: .8;
}
.item.pending { opacity: 0; }
.item.dragging {
  z-index: 999; pointer-events: none;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}
.item.pop { animation: pop .34s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop {
  0%   { transform: scale(.45); opacity: .3; }
  55%  { transform: scale(1.3); }
  100% { transform: scale(1); opacity: 1; }
}
.item.landed { animation: spawn .2s ease-out; }
@keyframes spawn {
  0%   { transform: scale(.7); opacity: .5; }
  60%  { transform: scale(1.12); }
  100% { transform: scale(1); opacity: 1; }
}
.item.glow { box-shadow: 0 0 0 3px rgba(212,83,126,.45), 0 0 18px rgba(212,83,126,.55); }

/* ===== 母体（生成器）===== */
.item.gen {
  outline: 1.5px solid rgba(255,255,255,.75);
  outline-offset: -2px;
}
.item.gen.ready { animation: genPulse 1.9s ease-in-out infinite; }
@keyframes genPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  50% { box-shadow: 0 0 0 3px rgba(255,255,255,.5); }
}
.item.gen.dry { filter: grayscale(.75); opacity: .62; }
.item .use {
  position: absolute; left: 1px; top: 0px;
  font-size: 8.5px; font-weight: 700; opacity: .85;
  font-variant-numeric: tabular-nums;
}
.item.gen .use { background: rgba(0,0,0,.22); border-radius: 3px; padding: 0 2px; }
/* 链中段发射器：同样可点击，但还能继续往上合，所以用虚线边框跟顶端母体区分 */
.item.mid { outline: 1.5px dashed rgba(255,255,255,.9); }
.item.mid.ready { animation: genPulse 2.6s ease-in-out infinite; }
/* 顶级纯任务物品 */
.item.fin { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }

/* 状态角标 */
.badge {
  position: absolute; left: -2px; top: -3px;
  width: 14px; height: 14px; border-radius: 50%;
  background: #4CAF50; color: #fff;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  z-index: 3;
  animation: badgeIn .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes badgeIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

/* 飞行中的物品 */
.flyer {
  position: fixed; left: 0; top: 0;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  z-index: 9200; pointer-events: none;
  will-change: transform;
  box-shadow: 0 5px 14px rgba(0,0,0,.18);
}

/* ==================== 发射器 ==================== */
.spawners { display: flex; gap: 8px; }
.spawner {
  flex: 1; background: #fff; border: 1px solid #E8E3DC; border-radius: 12px;
  padding: 9px 8px; display: flex; align-items: center; gap: 9px;
  cursor: pointer; user-select: none;
  transition: transform .09s ease, border-color .15s;
}
.spawner:active { transform: scale(.965); border-color: #1D9E75; }
.spawner .em { font-size: 23px; line-height: 1; }
.spawner.hit .em { animation: emHit .3s ease; }
@keyframes emHit {
  0% { transform: scale(1) rotate(0); }
  35% { transform: scale(1.28) rotate(-10deg); }
  100% { transform: scale(1) rotate(0); }
}
.spawner .meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.spawner .nm { font-size: 13px; font-weight: 600; }
.spawner .cost { font-size: 11px; color: #8A8781; white-space: nowrap; }

/* ---- 主要发射器冷却 ---- */
.spawner { position: relative; overflow: hidden; }
.spawner .cdchip {
  position: absolute; right: 5px; top: 4px;
  font-size: 9px; font-weight: 700; color: #C3BEB4;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.spawner .cdmask {
  position: absolute; inset: 0; display: none;
  align-items: center; justify-content: center;
  background: rgba(251,249,246,.74);
  -webkit-backdrop-filter: blur(1.5px); backdrop-filter: blur(1.5px);
  font-size: 13px; font-weight: 700; color: #5F5E5A;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.spawner.cooling .cdmask { display: flex; }
.spawner.cooling { cursor: default; }
.spawner.cooling:active { transform: none; border-color: #E8E3DC; }
.spawner .cdmask::after {
  content: ''; position: absolute; left: 0; bottom: 0;
  height: 3px; width: var(--p, 0%); background: #1D9E75;
  transition: width .25s linear;
}

/* ==================== 底部信息栏 ==================== */
.infobar { display: flex; gap: 7px; align-items: center; }
.infobar .hint {
  flex: 1; background: #fff; border: 1px solid #E8E3DC; border-radius: 10px;
  padding: 9px 12px; font-size: 12px; color: #8A8781;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.infobar .hint b { color: #2C2C2A; font-weight: 600; }
.infobar .shop {
  flex-shrink: 0; background: #fff; border: 1px solid #E8E3DC; border-radius: 10px;
  padding: 7px 11px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  cursor: pointer; user-select: none;
  transition: transform .09s ease;
}
.infobar .shop:active { transform: scale(.94); }
.infobar .shop .em { font-size: 17px; line-height: 1; }
.infobar .shop .tx { font-size: 10px; color: #8A8781; }
.infobar .back {
  flex-shrink: 0; background: #fff; border: 1px solid #E8E3DC; border-radius: 10px;
  width: 46px; display: flex; align-items: center; justify-content: center;
  font-size: 19px; cursor: pointer; user-select: none; color: #D85A30;
}
.infobar .back:active { background: #FAECE7; }

/* ==================== 飘字 / 提示 ==================== */
.float {
  position: fixed; pointer-events: none; z-index: 9500;
  font-size: 13px; font-weight: 700; color: #1D9E75;
  text-shadow: 0 1px 3px rgba(255,255,255,.9);
  animation: floatUp .85s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes floatUp {
  0%   { transform: translate(-50%, 0) scale(.7); opacity: 0; }
  20%  { transform: translate(-50%, -8px) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%, -46px) scale(1); opacity: 0; }
}
#toast {
  position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
  background: rgba(44,44,42,.9); color: #fff;
  font-size: 12.5px; padding: 9px 16px; border-radius: 20px;
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 9600; white-space: nowrap; max-width: 88vw;
  overflow: hidden; text-overflow: ellipsis;
}
#toast.on { opacity: 1; }

/* ==================== 调试行 ==================== */
.dbg { display: flex; gap: 6px; align-items: center; padding: 0 2px; flex-wrap: wrap; }
.dbg button {
  font-family: inherit; font-size: 11px; color: #8A8781;
  background: #fff; border: 1px solid #E8E3DC; border-radius: 7px;
  padding: 5px 9px; cursor: pointer;
}
.dbg button:active { background: #F1EFE8; }
.dbg .sp { margin-left: auto; font-size: 11px; color: #A8A49C; }

/* ==================== 链树弹窗 ==================== */
#tree {
  position: fixed; inset: 0; z-index: 9700;
  background: rgba(44,44,42,.42);
  display: none; align-items: center; justify-content: center; padding: 18px;
}
#tree.on { display: flex; }
#tree .card {
  background: #fff; border-radius: 16px; padding: 16px;
  width: 100%; max-width: 400px; max-height: 82vh; overflow-y: auto;
}
#tree h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; }
#tree .sub { font-size: 11.5px; color: #8A8781; margin-bottom: 12px; line-height: 1.5; }
#tree .row {
  border: 1px solid #E8E3DC; border-radius: 11px;
  padding: 9px 10px; margin-bottom: 8px;
}
#tree .row.lock { opacity: .48; }
#tree .rt { font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
#tree .rt .tag {
  font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 20px;
  margin-left: 5px; vertical-align: 1px;
}
#tree .tag.gen { background: #FAEEDA; color: #854F0B; }
#tree .tag.fin { background: #E6F1FB; color: #0C447C; }
#tree .tag.on { background: #E1F5EE; color: #0F6E56; }
#tree .tag.off { background: #F1EFE8; color: #888780; }
#tree .flow { font-size: 15px; letter-spacing: 1px; line-height: 1.7; }
#tree .note { font-size: 11px; color: #8A8781; margin-top: 4px; line-height: 1.5; }
#tree .close {
  margin-top: 4px; width: 100%; padding: 11px;
  background: #2C2C2A; color: #fff; border: 0; border-radius: 10px;
  font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="app">

  <!-- 顶部三币 -->
  <div class="hud">
    <div class="coin stamina" id="stStamina">
      <div class="row"><span class="ico">⚡</span><span class="val" id="vStamina">100/100</span><span class="sub" id="staminaSub">已满</span></div>
      <div class="bar"><i id="bStamina" style="width:100%"></i></div>
    </div>
    <div class="coin" id="stGold"><span class="ico">🪙</span><span class="val" id="vGold">0</span></div>
    <div class="coin" id="stGem"><span class="ico">💎</span><span class="val" id="vGem">0</span></div>
  </div>

  <!-- 功能栏 -->
  <div class="tools">
    <div class="tool" id="toolBoost">
      <span class="em">⏱️</span>
      <span class="tx"><span class="t1">加速器</span><span class="t2" id="boostSub">18m52s</span></span>
    </div>
    <div class="tool" id="toolTask">
      <span class="em">📋</span>
      <span class="tx"><span class="t1">任务</span><span class="t2" id="taskSub">0/2 待交付</span></span>
    </div>
    <div class="tool go" id="toolGo"><span class="t1">完成</span></div>
  </div>

  <div id="board"></div>

  <div class="spawners" id="spawners"></div>

  <div class="infobar">
    <div class="back" id="btnBack">↩</div>
    <div class="hint" id="hintBar">拖动相同物品合成 · 轻点带边框的物品产出 · 轻点🕸️花金币清除</div>
    <div class="shop" id="btnShop"><span class="em">🏪</span><span class="tx">商店</span></div>
  </div>

  <div class="dbg">
    <button id="btnTree">📖 链树</button>
    <button id="btnReset">重置存档</button>
    <button id="btnFill">补满体力</button>
    <button id="btnDebug">素材×4 + 蛛网（调试）</button>
    <button id="btnCd">发射器冷却（调试）</button>
    <span class="sp" id="tipLine">调试：快速验证母体 / 蛛网 / CD</span>
  </div>

</div>
<div id="toast"></div>

<div id="tree">
  <div class="card">
    <h3>链树 · 母体解锁结构</h3>
    <div class="sub">链的终点只有两种：<b>母体</b>（点击产出下一条链，耐久耗尽即消失）或 <b>纯任务物品</b>（只交订单）——<b>两者都不可再合成</b>。但发射器也可以出现在<b>链的中段</b>，既能点击、又能继续往上合；合成后耐久一律<b>重置为满</b>，所以"点剩最后 1 次再合成"是白赚的隐藏福利。</div>
    <div id="treeBody"></div>
    <button class="close" id="btnTreeClose">知道了</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ==================== 配置 ====================
  var COLS = 7, ROWS = 9, TOTAL = COLS * ROWS;
  var UNLOCK_ROWS = 5;
  var EXP_PER_LEVEL = 100;

  // ==================== 体力模型（已确认）====================
  var STAMINA_MAX = 100;            // 自然恢复上限；补贴领取可突破
  var REGEN_MS = 2 * 60 * 1000;     // 每 2 分钟恢复 1 点
  var BONUS_HOURS = [12, 18, 24];   // 每日三个补贴时段（24 = 当日 24:00）
  var BONUS_AMOUNT = 50;            // 每次补贴体力
  var CLICK_COST = 1;               // 点击一次恒定消耗 1 体力

  // ==================== 震动 ====================
  // 全项目只有一个振幅值，所有合成与升级完全一致，不做分级、不做递增。
  // 改成 0 即全局关闭屏幕震动（粒子与触觉反馈不受影响）。
  // 注意：震的是整个 #app，眼睛会跟整帧走，整屏位移的感知强度远高于同振幅的局部动画，
  // 所以这个值要压得很低。
  var SHAKE_AMP = 1.0;

  // ---- 链定义：items = 普通物品 Lv1..N；top = 顶端（母体 或 纯任务物品）----
  var CHAINS = {
    toy: {
      name: '玩具链', key: 'toy',
      items: [
        { name: '毛线球', emoji: '🧶', bg: '#FBEAF0', fg: '#72243E', fx: '#D4537E' },
        { name: '逗猫棒', emoji: '🎣', bg: '#F4C0D1', fg: '#72243E', fx: '#D4537E' },
        { name: '铃铛球', emoji: '🔔', bg: '#ED93B1', fg: '#4B1528', fx: '#D4537E' }
      ],
      top: {
        name: '猫城堡', emoji: '🏰', bg: '#993556', fg: '#FFFFFF', fx: '#993556',
        kind: 'generator', charges: 8,
        // 产出表：主要出护理链 Lv1，偶尔直接爆出高等级（对应原版"发射器产出多种物品 + 爆率"）
        drops: [
          { c: 'care', l: 1, w: 82 },
          { c: 'care', l: 2, w: 15 },
          { c: 'care', l: 3, w: 3 }
        ]
      }
    },
    care: {
      name: '护理链', key: 'care',
      items: [
        { name: '梳毛刷', emoji: '🪮', bg: '#E1F5EE', fg: '#04342C', fx: '#1D9E75' },
        { name: '指甲剪', emoji: '✂️', bg: '#9FE1CB', fg: '#04342C', fx: '#1D9E75' },
        { name: '洗澡球', emoji: '🛁', bg: '#5DCAA5', fg: '#04342C', fx: '#0F6E56' }
      ],
      top: {

  function burst(x, y, color, count, power) {
    count = count || 16; power = power || 1;
    for (var i = 0; i < count; i++) {
      var a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      var sp = (1.4 + Math.random() * 3.2) * power;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.8,

    }
  }

    box.innerHTML = '';
    BASE_SPAWNERS.forEach(function (s, i) {
      var main = s.drops.slice().sort(function (a, b) { return b.w - a.w; })[0];
      var d = defOf(main.c, main.l);
      var el = document.createElement('div');
      el.className = 'spawner';
      el.dataset.spawn = i;
      el.title = dropsDesc(s.drops) + '　冷却 ' + (s.cd / 1000) + ' 秒';
      el.innerHTML = '<span class="em">' + s.emoji + '</span>' +
        '<span class="meta"><span class="nm">' + s.name + '</span>' +
        '<span class="cost">' + d.emoji + d.name + ' · 1 体力</span></span>' +
        '<span class="cdchip">' + (s.cd / 1000) + 's</span>' +
        '<span class="cdmask"><span class="cdt"></span></span>';
      el.addEventListener('click', function () { spawn(i, el); });
      box.appendChild(el);
    });
    updateSpawnerCD();
  }

  // 每秒刷新冷却状态：只改类名与文字，不重建元素（否则会打断点击动画）
  function updateSpawnerCD() {
    var box = $('spawners');
    if (!box || !state || !state.spawnCd) return;
    var now = Date.now();
    for (var i = 0; i < BASE_SPAWNERS.length; i++) {
      var el = box.children[i];
      if (!el) continue;
      var left = (state.spawnCd[i] || 0) - now;
      var on = left > 0;
      if (el.classList.contains('cooling') !== on) el.classList.toggle('cooling', on);
      if (!on) continue;
      var m = el.querySelector('.cdmask');
      if (!m) continue;
      m.style.setProperty('--p', (100 * (1 - left / BASE_SPAWNERS[i].cd)).toFixed(1) + '%');
      var t = m.querySelector('.cdt');
      if (t) t.textContent = (left / 1000).toFixed(1) + 's';
    }
  }

  function renderAll() { renderBoard(); renderHUD(); renderTools(); renderTree(); updateSpawnerCD(); }

  // ==================== 存档 ====================
  var SAVE_KEY = 'pawpark_p0_save';

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !Array.isArray(s.board) || s.board.length !== TOTAL) return null;
      if (s.v !== 3) return null;              // 旧版存档结构不同，直接丢弃
      var dirty = false;
      if (!s.unlocked) { s.unlocked = { toy: true, care: false, food: false, supply: true }; dirty = true; }
      if (s.unlocked.supply !== true) { s.unlocked.supply = true; dirty = true; }  // 礼包链由基础发射器直接产出，始终可用
      if (typeof s.gem !== 'number') { s.gem = 60; dirty = true; }
      if (typeof s.gensMade !== 'number') { s.gensMade = 0; dirty = true; }
      if (typeof s.regenAt !== 'number') { s.regenAt = Date.now(); dirty = true; }
      if (!s.bonusClaimed || typeof s.bonusClaimed !== 'object') { s.bonusClaimed = {}; dirty = true; }
      if (!Array.isArray(s.spawnCd) || s.spawnCd.length !== BASE_SPAWNERS.length) {
        s.spawnCd = BASE_SPAWNERS.map(function () { return 0; }); dirty = true;
      }
      if (!Array.isArray(s.web) || s.web.length !== TOTAL) {
        s.web = new Array(TOTAL).fill(false); dirty = true;
      }
      if (typeof s.websCleared !== 'number') { s.websCleared = 0; dirty = true; }
      if (typeof s.produces !== 'number') { s.produces = 0; dirty = true; }
      // 迁移棋盘：链结构变更后可能留下"读不出定义的孤儿物品"，直接清掉；
      // 可点击的发射器补齐 / 清掉 u，避免旧存档出现 undefined 耐久
      for (var i = 0; i < s.board.length; i++) {
        try {
          var it = s.board[i];
          if (!it) continue;
          var dd = defOf(it.c, it.l);
          if (!dd) { s.board[i] = null; dirty = true; continue; }   // 孤儿物品：清掉
          if (isClickable(dd)) {
            if (typeof it.u !== 'number') { it.u = fullCharges(dd); dirty = true; }
          } else if (it.u != null) { delete it.u; dirty = true; }
        } catch (e) {
          s.board[i] = null; dirty = true;   // 单个坏物品只能牺牲自己，绝不能连累整份存档
        }
      }
      // 蛛网只能落在空格上；万一存档里出现"有物品又被盖网"的矛盾状态，以物品为准
      for (var w = 0; w < TOTAL; w++) {
        if (s.web[w] && s.board[w]) { s.web[w] = false; dirty = true; }
      }
      s.__dirty = dirty;        // 迁移结果需要立刻回写，由启动逻辑消费后删除
      return s;
    } catch (e) { return null; }
  }

  // ==================== 随机空格 ====================
  function pickRandomEmpty() {
    var empties = [];
    for (var i = 0; i < TOTAL; i++) {
      if (!isLocked(i) && !state.web[i] && state.board[i] === null) empties.push(i);
    }
    if (!empties.length) return -1;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  // ==================== 抛物线抛出动画 ====================
  // fromRect 必须在 renderBoard() 之前取好，否则元素被重建后 rect 会归零
  function flyTo(fromRect, toIdx, it, done) {
    var toEl = cellEls[toIdx];
    if (!toEl) { if (done) done(); return; }
    var tr = toEl.getBoundingClientRect();
    var fr = fromRect || { left: tr.left, top: tr.top - 60, width: tr.width, height: tr.height };

    var size = Math.max(20, tr.width - 4);
    var sx = fr.left + fr.width / 2, sy = fr.top + fr.height / 2;
    var tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;

    var d = defOf(it.c, it.l);
    var el = document.createElement('div');
    el.className = 'flyer';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = Math.round(size * 0.42) + 'px';
    el.style.background = d.bg;
    el.style.color = d.fg;
    el.textContent = d.emoji;
    document.body.appendChild(el);

    var dur = 300 + Math.random() * 110;
    var arc = 46 + Math.random() * 52;
    var spin = (Math.random() > 0.5 ? 1 : -1) * (140 + Math.random() * 140);
    var t0 = performance.now();

    function frame(now) {
      var t = (now - t0) / dur;
      if (t > 1) t = 1;
      var x = sx + (tx - sx) * t;
      var y = sy + (ty - sy) * t - Math.sin(Math.PI * t) * arc;
      var rot = spin * t;
      var sc = 1 + Math.sin(Math.PI * t) * 0.16;
      el.style.transform =
        'translate(' + (x - size / 2) + 'px,' + (y - size / 2) + 'px)' +
        ' rotate(' + rot + 'deg) scale(' + sc + ')';
      if (t < 1) { requestAnimationFrame(frame); }
      else {
        el.remove();
        if (done) done();
      }
    }
    requestAnimationFrame(frame);
  }

  // 把新物品放进随机空格并播放飞行；返回落点格号
  function emit(srcEl, c, l) {
    var target = pickRandomEmpty();
    if (target === -1) { toast('棋盘已满，先合成或交付订单'); return -1; }

    // 先取源位置：renderBoard() 可能重建该元素，重建后 rect 会变成 0
    var fromRect = srcEl ? srcEl.getBoundingClientRect() : null;

    var it = makeItem(c, l);
    state.board[target] = it;
    renderBoard();
    renderHUD();
    renderTools();
    var itemEl = cellEls[target].querySelector('.item');
    if (itemEl) itemEl.classList.add('pending');

    flyTo(fromRect, target, it, function () {
      var el = cellEls[target].querySelector('.item');
      if (el) {
        el.classList.remove('pending');
        el.classList.add('landed');
        var cc = centerOf(el);
        burst(cc.x, cc.y, defOf(c, l).fx, 6, 0.5);
      }
      updateBadges();
      renderTools();
    });
    return target;
  }

  // ==================== 主要发射器产出 ====================
  function spawn(idx, srcEl) {
    tickRegen();
    var s = BASE_SPAWNERS[idx];

    var left = (state.spawnCd[idx] || 0) - Date.now();
    if (left > 0) { toast(s.name + ' 冷却中 · 还需 ' + (left / 1000).toFixed(1) + 's'); return; }
    if (state.stamina < CLICK_COST) { toast('体力不足 · 每 2 分钟恢复 1 点'); return; }
    if (pickRandomEmpty() === -1) { toast('棋盘已满，先合成、清除蛛网或交付订单'); return; }

    state.stamina -= CLICK_COST;
    state.spawnCd[idx] = Date.now() + s.cd;
    var drop = rollDrops(s.drops);
    if (srcEl) { srcEl.classList.remove('hit'); void srcEl.offsetWidth; srcEl.classList.add('hit'); }
    emit(srcEl, drop.c, drop.l);
    updateSpawnerCD();
    countProduce();
    haptic(7);
    save();
  }

  // 每次产出后累计计数，到阈值就落一张蛛网（节奏阀）
  function countProduce() {
    state.produces++;
    if (state.produces % WEB_EVERY !== 0) return;
    if (addWeb()) toast('棋盘上出现了蛛网 —— 轻点花金币清除，或拖一个物品上去牺牲它');
  }

  // ==================== 蛛网 ====================
  function addWeb() {
    if (webCount() >= WEB_MAX) return false;
    var cands = [];
    for (var i = 0; i < TOTAL; i++) {
      if (!isLocked(i) && !state.web[i] && state.board[i] === null) cands.push(i);
    }
    if (!cands.length) return false;
    var t = cands[Math.floor(Math.random() * cands.length)];
    state.web[t] = true;
    renderBoard();
    var el = cellEls[t].querySelector('.web');
    if (el) {
      var c = centerOf(el);
      ring(c.x, c.y, '#BA7517', 40, 2.5);
      burst(c.x, c.y, '#DCD5CA', 10, 0.7);
    }
    return true;
  }

  function removeWeb(i) {
    var el = cellEls[i].querySelector('.web');
    var c = el ? centerOf(el) : centerOf(cellEls[i]);
    state.web[i] = false;
    state.websCleared++;
    if (el) {
      el.classList.add('clear');
      setTimeout(function () { renderBoard(); }, 300);
    } else {
      renderBoard();
    }
    burst(c.x, c.y, '#BA7517', 16, 1.0);
    ring(c.x, c.y, '#BA7517', 46, 3);
    return c;
  }

  // 方式一：轻点蛛网 → 花金币清除（价格随已清除数量递增）
  function tapWeb(i) {
    var p = webPrice();
    if (state.gold < p) { toast('金币不足 · 清除蛛网需 ' + p + ' 🪙'); return; }
    state.gold -= p;
    var c = removeWeb(i);
    floatText(c.x, c.y - 6, '-' + p + ' 🪙', '#854F0B');
    bump('stGold');
    renderHUD();
    haptic(12);
    save();
  }

  // 方式二：把物品拖到蛛网上 → 牺牲该物品换一个空格
  function sacrificeToWeb(webIdx, fromIdx) {
    var it = state.board[fromIdx];
    if (!it) return false;
    var c = removeWeb(webIdx);
    state.board[fromIdx] = null;
    var d = defOf(it.c, it.l);
    burst(c.x, c.y, d.fx, 14, 1.0);
    floatText(c.x, c.y - 6, d.emoji + ' 被蛛网吞掉', '#854F0B');
    toast('牺牲了 ' + d.name + ' 换回一个空格 —— 也可以改用金币清除');
    renderBoard();
    renderTools();
    haptic(14);
    save();
    return true;
  }

  // ==================== 发射器产出（顶端母体 / 链中段发射器）====================
  // 两者行为一致：消耗 1 体力 + 1 点耐久，按掉落表产出一个东西。
  // 区别只有两点：① 顶端母体用完即消失，中段发射器用完也消失但还能被合成；
  //             ② 掉落表可以产物品，也可以直接产货币（金币 / 钻石）。
  function produce(cellIdx) {
    var it = state.board[cellIdx];
    if (!it) return;
    var d = defOf(it.c, it.l);
    if (!isClickable(d)) return;
    if (typeof it.u !== 'number') it.u = fullCharges(d);   // 兼容旧存档

    tickRegen();
    if (it.u <= 0) { toast(d.name + ' 耐久已耗尽'); return; }
    if (state.stamina < CLICK_COST) { toast('体力不足 · 每 2 分钟恢复 1 点'); return; }

    var drop = rollDrops(d.drops);
    var isRes = isResDrop(drop);
    // 货币直接进余额、不占棋盘格，所以只有产物品时才需要预检空格
    if (!isRes && pickRandomEmpty() === -1) { toast('棋盘已满，先合成或交付订单'); return; }

    // 位置与中心点必须在改动 state 之前取好（元素会因耐久变化被重建，重建后 rect 归零）
    var el = cellEls[cellIdx].querySelector('.item');
    var cc = centerOf(el || cellEls[cellIdx]);

    state.stamina -= CLICK_COST;
    it.u--;
    var exhausted = it.u <= 0;

    if (isRes) {
      // 资源掉落：加余额 + 飘字 + 轻微粒子，不进棋盘
      var amount = rollRange(drop.gold != null ? drop.gold : drop.gem);
      var isGold = drop.gold != null;
      var rcol = isGold ? '#EF9F27' : '#7F77DD';
      if (isGold) { state.gold += amount; bump('stGold'); }
      else { state.gem += amount; bump('stGem'); }
      floatText(cc.x, cc.y - 10, '+' + amount + (isGold ? ' 🪙' : ' 💎'), rcol);
      burst(cc.x, cc.y, rcol, 12, 0.85);
      ring(cc.x, cc.y, rcol, 34, 2.2);
      // 资源掉落不走 emit()，所以必须自己重建，否则耐久徽标会停在旧值
      renderBoard();
    } else {
      emit(el, drop.c, drop.l);
      var pkd = defOf(drop.c, drop.l);
      ring(cc.x, cc.y, pkd.fx, 40, 2.5);
      floatText(cc.x, cc.y - 10, CHAINS[drop.c].name, pkd.fx);
    }

    if (exhausted) {
      // 耐久归零即消失：原版里次级发射器"点完连带发射器就没了，相当于一个物资包"
      state.board[cellIdx] = null;
      burst(cc.x, cc.y, d.fx, 18, 1.1);
      ring(cc.x, cc.y, d.fx, 54, 3);
      floatText(cc.x, cc.y - 28, d.name + ' 已耗尽', '#8A8781');
      toast(d.name + ' 耐久用完已消失 —— 需要重新从基础发射器发育一个');
      renderBoard();
      renderHUD();      // 资源掉落也要刷新余额显示
      renderTools();
      haptic(22);
    } else {
      renderHUD();
      haptic(9);
    }
    countProduce();
    save();
  }

  // ==================== 解锁新链 ====================
  function unlockChain(k) {
    if (state.unlocked[k]) return false;
    state.unlocked[k] = true;
    state.orders = [makeOrder(), makeOrder()];
    return true;
  }

  // ==================== 合成 ====================
  function merge(from, to) {
    var it = state.board[from];
    var k = it.c, lv = it.l;
    var dFrom = defOf(k, lv);
    // 顶端是链的终点：母体不可合成，纯任务物品也不可合成
    if (lv >= maxLv(k)) {
      toast(dFrom.kind === 'generator' ? '母体不可合成' : '已是顶端，不能再合成');
      return false;
    }

    var nextLv = lv + 1;
    var dNext = defOf(k, nextLv);

    // 甲·重置为满：合成出的发射器耐久一律回满，两个素材各自剩多少耐久都不继承。
    // 于是"点剩最后 1 次再合成"从"必须留 1 次才能合"升级成隐藏福利：
    // 点掉的次数全部白赚，合成后照样拿满耐久。下面把白赚的次数算出来反馈给玩家。
    var itB = state.board[to];
    var spent = 0;
    if (isClickable(dNext)) {
      var fullFrom = fullCharges(dFrom);
      if (typeof it.u === 'number') spent += Math.max(0, fullFrom - it.u);
      if (itB && typeof itB.u === 'number') spent += Math.max(0, fullFrom - itB.u);
    }

    state.board[from] = null;
    var newIt = { c: k, l: nextLv };
    if (isClickable(dNext)) newIt.u = fullCharges(dNext);
    state.board[to] = newIt;
    state.merges++;

    renderBoard();
    var el = cellEls[to].querySelector('.item');
    // 走到链的终点（母体 / 纯任务物品 / 无顶端的最高级）才算里程碑
    var isMilestone = nextLv >= maxLv(k);
    if (el) {
      el.classList.add('pop');
      var c = centerOf(el);
      var col = dNext.fx;
      // 粒子随等级递增：撤掉屏幕震动后，用局部特效承担"越合越爽"的反馈
      var lvBoost = Math.min(nextLv, 6) * 2;
      burst(c.x, c.y, col, (isMilestone ? 30 : 18) + lvBoost,
            isMilestone ? 1.5 : 1.05 + nextLv * 0.03);
      burst(c.x, c.y, '#FFFFFF', isMilestone ? 14 : 8, 0.8);
      ring(c.x, c.y, col, isMilestone ? 68 : 42 + nextLv * 3, isMilestone ? 4 : 3);
      var label = isMilestone
        ? (dNext.kind === 'generator' ? '母体 · ' + dNext.name
          : dNext.kind === 'producer' ? '终点 · ' + dNext.name
          : dNext.name)
        : 'Lv' + nextLv;
      floatText(c.x, c.y - 6, label, col);
      el.classList.add('glow');
      setTimeout(function () { el.classList.remove('glow'); }, 420);
    }
    // 甲规则的隐藏福利：告诉玩家"你点掉的次数白赚了"
    if (spent > 0) {
      setTimeout(function () {
        toast('隐藏福利：' + dNext.name + ' 耐久重置为满 ' + fullCharges(dNext) +
              ' 次 —— 你之前点掉的 ' + spent + ' 次白赚了');
      }, 430);
    }

    // ---- 震动：全局统一振幅，所有合成完全一致 ----
    if (SHAKE_AMP > 0) shake(SHAKE_AMP);
    haptic(isMilestone ? 26 : 12);

    // ---- 解锁下一条链 ----
    if (dNext.kind === 'generator') {
      state.gensMade++;
      if (unlockChain(dNext.produces)) {
        var pk = dNext.produces;
        setTimeout(function () {
          toast('解锁 ' + CHAINS[pk].name + '！' + dNext.name + ' 点击可产出 ' + defOf(pk, 1).name);
        }, 260);
      }
    }

    renderTools();
    save();
    return true;
  }

  // ==================== 交付订单 ====================
  function deliver(orderId) {
    var idx = -1;
    for (var k = 0; k < state.orders.length; k++) {
      if (state.orders[k].id === orderId) { idx = k; break; }
    }
    if (idx === -1) return false;

    var o = state.orders[idx];
    var slot = findItem(o.c, o.l);
    if (slot === -1) { toast('棋盘上没有这个物品'); return false; }

    var el = cellEls[slot].querySelector('.item');
    var c = el ? centerOf(el) : null;

    state.board[slot] = null;
    state.gold += o.gold;
    state.exp += o.exp;

    if (c) {
      burst(c.x, c.y, '#BA7517', 20, 1.1);
      ring(c.x, c.y, '#BA7517', 44, 3);
      floatText(c.x, c.y - 6, '+' + o.gold + ' 🪙', '#BA7517');
    }

    var leveled = false;
    while (state.exp >= state.level * EXP_PER_LEVEL) {
      state.exp -= state.level * EXP_PER_LEVEL;
      state.level++;
      leveled = true;
    }

    bump('stGold');
    haptic(18);

    if (leveled) {
      if (SHAKE_AMP > 0) shake(SHAKE_AMP);
      var vw = window.innerWidth, vh = window.innerHeight;
      for (var n = 0; n < 3; n++) {
        (function (n) {
          setTimeout(function () {
            burst(vw * (0.25 + n * 0.25), vh * 0.32, '#7F77DD', 22, 1.4);
            ring(vw * (0.25 + n * 0.25), vh * 0.32, '#7F77DD', 60, 4);
          }, n * 110);
        })(n);
      }
      floatText(vw / 2, vh * 0.3, 'Lv' + state.level + ' 达成', '#7F77DD');
      haptic(40);
    }

    state.orders[idx] = makeOrder();
    renderAll();
    save();
    return true;
  }

  function deliverAll() {
    var n = state.orders.filter(function (o) { return findItem(o.c, o.l) !== -1; }).length;
    if (!n) { toast('没有可交付的订单'); return; }

    var done = 0;
    for (var i = 0; i < state.orders.length; i++) {
      if (findItem(state.orders[i].c, state.orders[i].l) !== -1) {
        var id = state.orders[i].id;
        if (deliver(id)) done++;
      }
    }
    if (done) toast('已交付 ' + done + ' 个订单');
  }

  // ==================== 链树面板 ====================
  function renderTree() {
    var h = '';
    TREE_ORDER.forEach(function (k) {
      var ch = CHAINS[k];
      var on = !!state.unlocked[k];
      // 可点击的等级标一个 ⚡，一眼看出"这条链哪几级是发射器"
      var flow = ch.items.map(function (d) { return d.emoji + (d.click ? '⚡' : ''); }).join(' → ');
      var top = ch.top;
      if (top) flow += ' → ' + top.emoji + ' ' + top.name;

      var tag;
      if (top && top.kind === 'generator') tag = '<span class="tag gen">顶端母体</span>';
      else if (top) tag = '<span class="tag fin">顶级任务</span>';
      else tag = '<span class="tag gen">中段发射器</span>';
      var st = on
        ? '<span class="tag on">已解锁</span>'
        : '<span class="tag off">未解锁</span>';

      var note;
      if (!top) {
        var last = ch.items[ch.items.length - 1];
        note = '链的终点就是 <b>' + last.name + '</b>（Lv' + ch.items.length +
               '），它本身是发射器：点击产出 ' + dropsDesc(last.click.drops) +
               '，耐久 ' + last.click.charges + ' 次。Lv1 的 ' + ch.items[0].name +
               ' 同样可点击（' + dropsDesc(ch.items[0].click.drops) + '，耐久 ' +
               ch.items[0].click.charges + ' 次），两个 Lv1 合成 Lv2 时耐久<b>重置为满</b>。';
      } else if (top.kind === 'generator') {
        // 注意：top 是原始链定义，产出链要从 drops[0] 取，它身上没有 produces 字段
        var pk = top.drops[0].c;
        note = '合成出 ' + top.name + ' → 点击产出【' + CHAINS[pk].name + '】' +
               defOf(pk, 1).name + '；掉落表 ' + dropsDesc(top.drops) + '，耐久 ' +
               top.charges + ' 次，用完母体即消失（相当于一个物资包）。母体不可合成。';
      } else {
        note = '合成链到此为止，' + top.name + ' 只用于交付订单，不能再合成、也不能点击';
      }
      h += '<div class="row' + (on ? '' : ' lock') + '">' +
           '<div class="rt">' + ch.name + tag + st + '</div>' +
           '<div class="flow">' + flow + '</div>' +
           '<div class="note">' + note + '</div>' +
           '</div>';
    });
    h += '<div class="note" style="margin-top:2px">' +
         '<b>链的终点只有两种：</b>母体（可点击产出下一条链，耐久用完即消失）或 纯任务物品（只交订单）。' +
         '两种都<b>不可再合成</b>。<br>' +
         '<b>但发射器也可以出现在链的中段</b>（如礼包链 Lv1 → Lv2），中段发射器既能点击、又能继续往上合。' +
         '本项目采用「甲·重置为满」：合成后耐久一律回满、不继承剩余次数，' +
         '所以"点剩最后 1 次再合成"是纯白赚的隐藏福利。</div>';
    $('treeBody').innerHTML = h;
  }

  // ==================== 拖拽 ====================
  var drag = null;

  function cellFromPoint(x, y) {
    var el = document.elementFromPoint(x, y);
    if (!el || !el.closest) return -1;
    var cell = el.closest('.cell');
    return cell ? +cell.dataset.i : -1;
  }
  function clearHints() {
    for (var i = 0; i < TOTAL; i++) cellEls[i].classList.remove('ok', 'merge', 'gen-hint', 'websac');
  }

  boardEl.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var cell = e.target.closest ? e.target.closest('.cell') : null;
    if (!cell) return;
    var i = +cell.dataset.i;
    if (isLocked(i)) return;
    // 轻点蛛网：花金币清除（方式一）
    if (state.web[i] && state.board[i] === null) { tapWeb(i); return; }
    if (state.board[i] === null) return;
    var el = cell.querySelector('.item');
    if (!el) return;

    e.preventDefault();
    drag = { from: i, el: el, sx: e.clientX, sy: e.clientY, moved: false };
    el.classList.add('dragging');
    el.style.transform = 'scale(1.12)';
    haptic(5);
  });

  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    e.preventDefault();
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) drag.moved = true;
    drag.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.12)';

    var t = cellFromPoint(e.clientX, e.clientY);
    clearHints();
    if (t >= 0 && t !== drag.from && !isLocked(t)) {
      var a = state.board[drag.from], b = state.board[t];
      // 拖到蛛网上：提示"牺牲这个物品可以清网"
      if (state.web[t] && b === null) cellEls[t].classList.add('websac');
      else if (b === null) cellEls[t].classList.add('ok');
      else if (sameKind(a, b) && a.l < maxLv(a.c)) cellEls[t].classList.add('merge');
    }
  }, { passive: false });

  function describe(it) {
    var d = defOf(it.c, it.l);
    var ch = CHAINS[it.c];
    if (d.kind === 'generator') {
      return '<b>' + d.name + '</b>　Lv' + it.l + '　母体 · 耐久 ' + it.u + '/' + d.charges +
             '　点击产出 ' + dropsDesc(d.drops) +
             '　<b>母体不可合成</b>，用完即消失';
    }
    if (d.kind === 'producer') {
      var pn = defOf(it.c, it.l + 1);
      return '<b>' + d.name + '</b>　Lv' + it.l + '　' + ch.name +
             '　发射器 · 耐久 ' + it.u + '/' + fullCharges(d) +
             '　点击产出 ' + dropsDesc(d.drops) +
             (pn ? '　再合 1 个 → ' + pn.emoji + pn.name + '（耐久重置为满）'
                 : '　<b>已是链的终点</b>');
    }
    if (d.kind === 'final') {
      return '<b>' + d.name + '</b>　Lv' + it.l + '　' + ch.name + '顶级 · 只用于交付订单';
    }
    var nxt = defOf(it.c, it.l + 1);
    return '<b>' + d.name + '</b>　Lv' + it.l + '　' + ch.name +
           '　再合 1 个 → ' + nxt.emoji + (nxt.kind === 'generator' ? '母体' + nxt.name : nxt.name);
  }

  function endDrag(e) {
    if (!drag) return;
    var d = drag; drag = null;
    d.el.classList.remove('dragging');
    d.el.style.transform = '';
    clearHints();

    if (!d.moved) {
      // 轻点：母体则产出，其他显示详情
      var it = state.board[d.from];
      if (it) {
        var dd = defOf(it.c, it.l);
        if (isClickable(dd)) { produce(d.from); return; }
        $('hintBar').innerHTML = describe(it);
      }
      renderBoard();
      return;
    }

    var t = cellFromPoint(e.clientX, e.clientY);
    if (t < 0 || t === d.from || isLocked(t)) { renderBoard(); return; }

    var a = state.board[d.from], b = state.board[t];
    // 拖到蛛网上：牺牲物品换空格（方式二）
    if (state.web[t] && b === null) { sacrificeToWeb(t, d.from); return; }
    if (b === null) {
      state.board[t] = a;
      state.board[d.from] = null;
      renderBoard();
      haptic(6);
      save();
    } else if (sameKind(a, b)) {
      merge(d.from, t);
    } else {
      renderBoard();
    }
  }

  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', function () {
    if (!drag) return;
    var d = drag; drag = null;
    d.el.classList.remove('dragging'); d.el.style.transform = '';
    clearHints(); renderBoard();
  });

  // ==================== 事件 ====================
  // 点击体力条领取补贴（仅在可领时生效）
  $('stStamina').addEventListener('click', function () {
    var b = currentBonus();
    if (b && !b.claimed) claimBonus();
  });

  $('toolGo').addEventListener('click', deliverAll);
  $('toolBoost').addEventListener('click', function () { toast('加速器：正式版接入冷却缩减'); });
  $('toolTask').addEventListener('click', function () {
    var ready = state.orders.filter(function (o) { return findItem(o.c, o.l) !== -1; }).length;
    toast('当前 ' + ready + '/' + state.orders.length + ' 个订单可交付');
  });
  $('btnShop').addEventListener('click', function () { toast('商店：正式版接入模拟充值'); });
  $('btnBack').addEventListener('click', function () { toast('返回：正式版接入主界面'); });

  $('btnTree').addEventListener('click', function () { renderTree(); $('tree').classList.add('on'); });
  $('btnTreeClose').addEventListener('click', function () { $('tree').classList.remove('on'); });
  $('tree').addEventListener('click', function (e) {
    if (e.target === $('tree')) $('tree').classList.remove('on');
  });

  $('btnReset').addEventListener('click', function () {
    if (!confirm('确定重置存档吗？当前进度会全部清空。')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    state = freshState(); seedBoard(); renderAll(); save(); toast('已重置');
  });
  $('btnFill').addEventListener('click', function () {
    state.stamina = STAMINA_MAX; renderHUD(); save(); toast('体力已补满');
  });
  // 调试：一步验证两种终点 —— 玩具链顶级 ×2（合成出母体）+ 伴手礼 ×2（合成出礼盒）+ 1 张蛛网
  $('btnDebug').addEventListener('click', function () {
    var give = [{ c: 'toy', l: itemsLen('toy') }, { c: 'toy', l: itemsLen('toy') },
                { c: 'supply', l: 1 }, { c: 'supply', l: 1 }];
    var n = 0;
    give.forEach(function (g) {
      var t = pickRandomEmpty();
      if (t < 0) return;
      state.board[t] = makeItem(g.c, g.l);
      n++;
    });
    var web = addWeb();
    renderAll(); save();
    var msg = n ? '已放入 ' + n + ' 个素材（玩具链顶级 ×2 → 母体；伴手礼 ×2 → 礼盒）' : '棋盘已满';
    if (web) msg += '；并落下一张蛛网（价 ' + webPrice() + ' 🪙）';
    toast(msg);
  });

  // 调试：立即让两个主要发射器进入冷却，便于观察 CD 表现
  $('btnCd').addEventListener('click', function () {
    BASE_SPAWNERS.forEach(function (s, i) { state.spawnCd[i] = Date.now() + s.cd; });
    updateSpawnerCD(); save();
    toast('两个主要发射器已进入冷却（玩具架 ' + BASE_SPAWNERS[0].cd / 1000 + 's / 玩具箱 ' + BASE_SPAWNERS[1].cd / 1000 + 's）');
  });

  // ==================== 启动 ====================
  buildBoard();
  state = load();
  if (!state) {
    state = freshState();
    seedBoard();
    save();
  } else {
    // 旧存档被迁移过就立刻回写，避免玩家不操作时迁移结果丢失
    var migrated = !!state.__dirty;
    delete state.__dirty;
    if (migrated) save();
  }
  tickRegen();
  renderSpawners();
  renderAll();

  // 每秒刷新：体力自然恢复 + 下一点倒计时 + 补贴可领提示 + 发射器冷却倒计时
  setInterval(function () {
    var grew = tickRegen();
    renderHUD();
    updateSpawnerCD();
    if (grew) save();
  }, 1000);

  // 手机切后台时 setInterval 会被节流，回到前台要立刻补算
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (tickRegen()) save();
      renderAll();
    }
  });
})();
</script>
</body>
</html>
